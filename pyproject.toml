[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-enhancement-evaluation-benchmark"
version = "1.0.0"
description = "Reproducible paired clean/noise speech enhancement evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
 "numpy==2.3.5", "scipy==1.17.0", "soundfile==0.13.1",
 "pystoi==0.4.1", "pandas==2.2.3", "matplotlib==3.10.8",
 "PyYAML==6.0.3", "pesq==0.0.4"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.5"]

[project.scripts]
speech-benchmark = "speech_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: requires externally supplied data", "pesq: requires installed PESQ binding"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
